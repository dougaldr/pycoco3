[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-coco"
version = "0.5.0"
description = "Python CoCo 3 emulator with timed bus cycles, weak-bit and flux disk playback"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = ["pygame-ce>=2.5.8,<3"]

[project.scripts]
python-coco = "coco.frontend:main"

[tool.setuptools.packages.find]
include = ["coco*"]
